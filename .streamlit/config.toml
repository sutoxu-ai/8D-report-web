[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#1677ff"
backgroundColor = "#0d1b3d"
secondaryBackgroundColor = "#16263f"
textColor = "#ffffff"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = false

[client]
showErrorDetails = false

[runner]
magicEnabled = false

[ui]
hideDeployedWithStreamlit = true
